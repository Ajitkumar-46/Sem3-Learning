<!DOCTYPE html>
<html>
<head>
    <title>Quiz App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="box" id="startPage">
    <h1>Quiz App</h1>

    <input type="text" id="name" placeholder="Enter Name">
    <input type="text" id="roll" placeholder="Roll Number"
           maxlength="13"
           oninput="this.value=this.value.replace(/[^0-9]/g,'')">
    <input type="text" id="section" placeholder="Enter Section">

    <p id="error"></p>

    <button onclick="startQuiz()">Start Quiz</button>
</div>


<div class="box" id="quizPage">

    <h2 id="question"></h2>

    <h3>Time: <span id="time">30</span> sec</h3>

    <div id="options"></div>

    <button class="next" onclick="nextQuestion()">Next</button>

</div>


<div class="box" id="resultPage">

    <h1>Quiz Completed</h1>

    <h2 id="studentName"></h2>

    <h2 id="result"></h2>

    <button onclick="location.reload()">Restart</button>

</div>


<script src="script.js"></script>

</body>
</html>
